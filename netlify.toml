# Netlify · compilación desde GitHub
# Cada push a la rama principal reconstruye y publica el sitio.

[build]
command = "node build.mjs"
publish = "dist"

[build.environment]
NODE_VERSION = "20"

# Proxy del formulario hacia Google Apps Script.
# Esta URL debe ser la de la implementación ACTIVA (termina en /exec).
# Para actualizarla: Implementar → Administrar implementaciones → copiar URL.
[[redirects]]
from = "/api/cotizacion"
to = "https://script.google.com/macros/s/AKfycbwj3hEDWUEcZa94a1ZThZHK4lWbJW7CsmGysRbXUayBrJcTV-MNWNHSd6BcZCZigBua/exec"
status = 200
force = true

# Un solo dominio canónico
[[redirects]]
from = "https://www.*"
to = "https://:splat"
status = 301
force = true

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "SAMEORIGIN"
Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
