<section id="oferta" class="section section--azul oferta" aria-labelledby="oferta-titulo">
  <div class="oferta__fondo" aria-hidden="true"></div>
  <img
    class="oferta__truck"
    src="/assets/vehiculos/silverado/cutout-blanco-1400.webp"
    alt=""
    aria-hidden="true"
    width="1314"
    height="630"
    loading="lazy"
    decoding="async"
  />

  <div class="container oferta__inner">
    <header class="section-header section-header--center oferta__cabecera">
      <p class="eyebrow eyebrow--light">Beneficios de lanzamiento</p>
      <h2 id="oferta-titulo" data-oferta-titulo>ESTRENA TU CHEVROLET SILVERADO CON BENEFICIOS ESPECIALES</h2>
      <p class="lead" data-oferta-subtitulo></p>
      <p class="tag tag--dark oferta__vigencia" data-oferta-vigencia hidden></p>
    </header>

    <div class="oferta__beneficios stagger" data-oferta-beneficios>
      <noscript>
        <p class="oferta__noscript">
          Activa JavaScript para ver los beneficios de la promoción o solicita la información en el
          formulario de cotización.
        </p>
      </noscript>
    </div>

    <div class="oferta__acciones">
      <a class="btn btn--primary btn--lg" href="#cotizacion" data-oferta-cta data-cta="oferta">
        <span data-oferta-cta-label>QUIERO MI COTIZACIÓN</span>
        <svg class="btn__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false">
          <path d="M2 8h11M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>
    </div>

    <div class="oferta__notas">
      <p class="disclaimer disclaimer--light" data-oferta-nota-corta></p>
      <p class="disclaimer disclaimer--light" data-oferta-nota-legal></p>
    </div>
  </div>
</section>
