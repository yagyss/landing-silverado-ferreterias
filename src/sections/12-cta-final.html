<section id="cierre" class="section cierre" aria-labelledby="cierre-titulo">
  <div class="cierre__media" aria-hidden="true">
    <picture>
      <source data-cierre-source media="(min-width: 760px)" srcset="assets/vehiculos/silverado/cierre-cinematico-1122.webp" />
      <img
        data-cierre-img
        src="assets/vehiculos/silverado/cierre-cinematico-800.webp"
        alt=""
        width="800"
        height="445"
        loading="lazy"
        decoding="async"
      />
    </picture>
  </div>
  <div class="cierre__scrim" aria-hidden="true"></div>

  <div class="container cierre__inner">
    <p class="eyebrow eyebrow--light">Chevrolet Silverado</p>
    <h2 id="cierre-titulo">TU FERRETERÍA NO DEJA DE CRECER. DALE LA MOVILIDAD QUE NECESITA</h2>
    <p class="lead cierre__lead">
      Conoce Chevrolet Silverado y descubre cómo puede acompañar las necesidades de transporte de
      tu negocio.
    </p>

    <div class="cierre__acciones">
      <a class="btn btn--primary btn--lg" href="#cotizacion" data-cta="cierre">
        <span>SOLICITAR COTIZACIÓN</span>
        <svg class="btn__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false">
          <path d="M2 8h11M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>
    </div>

    <div class="cierre__pie">
      <p class="disclaimer disclaimer--light cierre__disclaimer" data-cierre-disclaimer></p>
      <div class="cierre__legal">
        <p class="cierre__marca" data-cierre-marca>Chevrolet Silverado · 2026</p>
        <a class="cierre__aviso" href="#aviso-privacidad" data-cierre-aviso data-open-privacidad>Aviso de privacidad</a>
      </div>
    </div>
  </div>
</section>
