<section id="transformacion" class="section section--paper transform" aria-labelledby="transformacion-titulo">
  <div class="container">
    <div class="section-header">
      <p class="eyebrow">La transformación</p>
      <h2 id="transformacion-titulo">De depender de terceros a tener mayor autonomía logística</h2>
      <p class="lead">
        Así cambia la operación de una ferretería cuando la logística deja de depender de
        terceros y pasa a resolverse con un vehículo propio.
      </p>
    </div>

    <div class="transform__grid">
      <!-- ANTES · tratamiento apagado -->
      <article class="transform__card transform__card--antes" aria-labelledby="transformacion-antes">
        <header class="transform__cabecera">
          <p class="transform__etapa" id="transformacion-antes">
            <span class="transform__etapa-marca" aria-hidden="true"></span>
            Antes
          </p>
          <p class="transform__subtitulo">Operación apoyada en terceros</p>
        </header>

        <ul class="transform__lista" data-transformacion-antes></ul>

        <noscript>
          <p class="transform__noscript">Activa JavaScript para ver la comparación completa.</p>
        </noscript>
      </article>

      <!-- Divisor central -->
      <div class="transform__flecha" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" focusable="false">
          <path d="M12 4v15M5 13l7 7 7-7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>

      <!-- DESPUÉS · bloque destacado -->
      <article class="transform__card transform__card--despues reveal reveal--right" aria-labelledby="transformacion-despues">
        <header class="transform__cabecera">
          <p class="transform__etapa transform__etapa--despues" id="transformacion-despues">
            <span class="transform__etapa-marca" aria-hidden="true"></span>
            Después
          </p>
          <p class="transform__subtitulo">Logística bajo tu control</p>
        </header>

        <ul class="transform__lista transform__lista--despues stagger" data-transformacion-despues></ul>

        <noscript>
          <p class="transform__noscript">Activa JavaScript para ver la comparación completa.</p>
        </noscript>
      </article>
    </div>

    <p class="disclaimer transform__nota" data-transformacion-nota></p>
  </div>
</section>
